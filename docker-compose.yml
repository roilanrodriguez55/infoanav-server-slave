services:
  # Base de datos PostgreSQL
  db:
    image: postgres:17-alpine
    container_name: infoanav-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: infoanav
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infoanav-backup-202604011100.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d infoanav"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - infoanav-network

  # PostgREST API
  postgrest:
    image: postgrest/postgrest:v14.5
    container_name: infoanav-postgrest
    environment:
      PGRST_DB_URI: postgres://postgres:admin@db:5432/infoanav
      PGRST_DB_SCHEMAS: api,auth
      PGRST_DB_EXTRA_SEARCH_PATH: api,auth
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: 12345678123456781234567812345678
      PGRST_SERVER_PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - infoanav-network

  # Servidor Node.js con Swagger UI
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infoanav-app
    environment:
      PORT: 8080
      POSTGREST_URL: http://postgrest:3000
      # Configuración de conexión a base de datos para restauración
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: admin
      DB_NAME: infoanav
      # Opciones de restauración del backup (patrón: infoanav-backup-*.sql)
      # auto: restaura solo si la DB está vacía (por defecto)
      # force: fuerza la restauración (sobrescribe datos existentes)
      skip: omite la restauración
      RESTORE_BACKUP: auto
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      postgrest:
        condition: service_started
    networks:
      - infoanav-network

volumes:
  postgres_data:

networks:
  infoanav-network:
    driver: bridge
