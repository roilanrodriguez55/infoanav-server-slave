services:
  # Base de datos PostgreSQL
  db:
    image: postgres:17-alpine
    container_name: infoanav-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: infoanav
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d infoanav"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - infoanav-network

  # PostgREST — most settings from postgrest-docker.conf; PGRST_DB_URI overrides db-uri (needed if hostname "db" does not resolve)
  postgrest:
    image: postgrest/postgrest:v14.7
    container_name: infoanav-postgrest
    environment:
      PGRST_DB_URI: ${POSTGREST_DB_URI:-postgres://postgres:admin@db:5432/infoanav}
      PGRST_DB_SCHEMAS: api,auth
      PGRST_DB_CHANNEL: pgrst
    volumes:
      - ./postgrest-docker.conf:/etc/postgrest.conf:ro
    command: ["postgrest", "/etc/postgrest.conf"]
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    networks:
      - infoanav-network

  # Servidor Node.js con Swagger UI
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infoanav-app
    environment:
      PORT: 8080
      POSTGREST_URL: http://postgrest:3000
      # Configuración de conexión a base de datos para restauración
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: admin
      DB_NAME: infoanav
      # Backup: patrón infoanav-backup-*.sql en /app o /app/backups (SQL plano o pg_dump -Fc; pg_restore si es custom)
      # RESTORE_BACKUP: auto = solo si no hay tablas en schema api | force = siempre | skip = no restaurar
      # Reimportar desde cero: RESTORE_BACKUP=force y docker compose down -v (borra volumen postgres_data)
      # SETUP_DATABASE_ROLES: auto = no pisar GRANT si ya existen anon, usuario_comun, administrador (alineado al dump)
      #                       always = aplicar plantilla del entrypoint cada arranque | never = no tocar roles
      # database-expectations.json: validate + ensure roles antes de restore + verify grants después de setup
      # DB_EXPECTATIONS_MODE: full (defecto) | skip | off | false | 0
      # DB_EXPECTATIONS_STRICT: 1 = el contenedor falla si verify-grants no coincide con el JSON
      # DB_EXPECTATIONS_FILE: ruta al JSON (defecto database-expectations.json en /app)
      # DB_EXPECTATIONS_PROFILE: restoredFromDump | afterEntrypointAlways (debe coincidir con SETUP_DATABASE_ROLES + origen de GRANT)
      # POST_RESTORE_PATCH: auto (defecto) = scripts/sql/post-restore.sql tras restore; skip = omitir
      DB_EXPECTATIONS_PROFILE: afterEntrypointAlways
      # Same file postgrest uses; entrypoint syncs auth.login fallback to jwt-secret here
      POSTGREST_CONF: /app/postgrest-docker.conf
      SKIP_POSTGREST: "true"
      RESTORE_BACKUP: force
      SETUP_DATABASE_ROLES: always
    volumes:
      # Montaje opcional: coloca dumps en ./backups sin reconstruir la imagen
      - ./backups:/app/backups:ro
      - ./scripts:/app/scripts:ro
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      postgrest:
        condition: service_started
    networks:
      - infoanav-network

volumes:
  postgres_data:

networks:
  infoanav-network:
    driver: bridge
