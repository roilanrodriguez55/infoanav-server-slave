services:
  # Base de datos PostgreSQL
  db:
    image: postgres:17-alpine
    container_name: infoanav-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: infoanav
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DB_HOST_PORT:-5437}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d infoanav"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - infoanav-network

  # PostgREST — most settings from postgrest-docker.conf; PGRST_DB_URI overrides db-uri (needed if hostname "db" does not resolve)
  postgrest:
    image: postgrest/postgrest:v14.7
    container_name: infoanav-postgrest
    environment:
      PGRST_DB_URI: ${POSTGREST_DB_URI:-postgres://postgres:admin@db:5432/infoanav}
      PGRST_DB_SCHEMAS: api,auth
      PGRST_DB_EXTRA_SEARCH_PATH: api, auth, public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:-12345678123456781234567812345678}
      PGRST_DB_CHANNEL: pgrst
      PGRST_SERVER_PORT: "3000"
    command: ["postgrest"]
    ports:
      - "${POSTGREST_HOST_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - infoanav-network

  # Servidor Node.js con Swagger UI
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infoanav-app
    env_file:
      - .env.docker
    environment:
      PORT: 8080
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PGCLIENTENCODING: UTF8
      POSTGREST_URL: http://postgrest:3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: admin
      DB_NAME: infoanav
      RESTORE_BACKUP: ${RESTORE_BACKUP:-auto}
      SETUP_DATABASE_ROLES: ${SETUP_DATABASE_ROLES:-auto}
      DB_EXPECTATIONS_PROFILE: ${DB_EXPECTATIONS_PROFILE:-afterEntrypointAlways}
      POSTGREST_CONF: /app/postgrest-docker.conf
      SKIP_POSTGREST: "true"
      POST_RESTORE_PATCH: ${POST_RESTORE_PATCH:-auto}
      DB_EXPECTATIONS_MODE: ${DB_EXPECTATIONS_MODE:-full}
      DB_EXPECTATIONS_STRICT: ${DB_EXPECTATIONS_STRICT:-0}
    volumes:
      # Solo backups: dumps opcionales sin reconstruir imagen (scripts/entrypoint van en la imagen)
      - ./backups:/app/backups:ro
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
      postgrest:
        condition: service_started
    networks:
      - infoanav-network

volumes:
  postgres_data:

networks:
  infoanav-network:
    driver: bridge
